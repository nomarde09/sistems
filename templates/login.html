{% extends "base.html" %}
{% block title %}Вход — Заявки{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Вход</h1>
  <p class="muted">Выберите, кто вы, и введите пароль из 4 цифр.</p>

  {% if error %}<p class="alert">{{ error }}</p>{% endif %}

  <form method="post" class="login-form">
    <fieldset class="who-list">
      <legend class="sr-only">Кто вы</legend>
      {% for user_id, u in users.items() %}
      <label class="who-option">
        <input type="radio" name="user_id" value="{{ user_id }}" {% if selected == user_id %}checked{% endif %} required>
        <span>{{ u.name }}</span>
      </label>
      {% endfor %}
    </fieldset>

    <label class="field">
      <span>Пароль</span>
      <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
             autocomplete="current-password" required placeholder="••••">
    </label>

    <button class="button primary" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
