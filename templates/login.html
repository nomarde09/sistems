{% extends "base.html" %}
{% block title %}Вход — Заявки{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Вход</h1>
  <p class="muted">Введите свой логин и пароль.</p>

  {% if error %}<p class="alert">{{ error }}</p>{% endif %}

  <form method="post" class="login-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">
      <span>Логин</span>
      <input type="text" name="login" value="{{ typed_login }}" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false" required class="plain">
    </label>
    <label class="field">
      <span>Пароль</span>
      <input type="password" name="password" autocomplete="current-password" required class="plain">
    </label>
    <button class="button primary" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
