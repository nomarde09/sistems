<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заявки{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">Заявки</a>
      {% if user %}
      <div class="who">
        <span class="who-name">{{ user.name }}</span>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="link-button" type="submit">Выйти</button>
        </form>
      </div>
      {% endif %}
    </div>
    {% if user and user.role == 'brigade' %}
    <nav class="tabs">
      <a href="{{ url_for('brigade_home') }}" class="{{ 'active' if request.endpoint == 'brigade_home' }}">
        Свободные <span class="count">{{ counts.free }}</span></a>
      <a href="{{ url_for('brigade_mine') }}" class="{{ 'active' if request.endpoint == 'brigade_mine' }}">
        Мои заявки <span class="count">{{ counts.mine }}</span></a>
    </nav>
    {% endif %}
  </header>
  <main class="page">
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ 'notice' if category == 'ok' else 'alert' }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
