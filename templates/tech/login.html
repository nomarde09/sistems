{% extends "base.html" %}
{% block title %}Технический вход{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Технический вход</h1>
  <p class="muted">Только для разработчика и системного аудита.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" class="login-form" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">
      <span>Логин</span>
      <input type="text" name="login" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">
      <span>Пароль</span>
      <input type="password" name="password" autocomplete="current-password" required class="plain">
    </label>
    <button class="button primary" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
